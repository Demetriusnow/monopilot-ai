services:
  - type: web
    name: monopilot-ai
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "8000"
      - key: DATABASE_PATH
        value: /tmp/monopilot.db
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3.5-flash-lite,gemini-3.1-flash-lite
      - key: GEMINI_TIMEOUT_MS
        value: "30000"
      - key: GEMINI_API_KEY
        sync: false
